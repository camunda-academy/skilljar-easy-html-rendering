<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root { --ico:1.25rem; color-scheme:light; --fg:#1c1c1e; --bg:#fff; --muted:#5f6368; --line:#e3e3e3; --code:#f5f5f5; --accent:#fc5d0d; }
  body { font:14px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--fg); background:var(--bg); max-width:50rem; margin:0 auto; padding:1.5rem 1rem 3rem; }
  html { overflow-x:hidden; }
  .banner { margin:-1.5rem calc(50% - 50vw) 1.5rem; }
  .banner p { margin:0; }
  .banner p > img:only-child { display:block; width:100vw; max-width:none; border:0; border-radius:0; }
  h1,h2,h3 { line-height:1.25; }
  h2 { margin-top:2.2rem; } h3 { margin-top:2rem; padding-top:.4rem; border-top:1px solid var(--line); }
  h1 { font-size:1.6rem; } h2 { font-size:1.3rem; } h3 { font-size:1.1rem; }
  a { color:var(--accent); }
  code, pre { font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; }
  code { background:var(--code); padding:.05em .3em; border-radius:4px; font-size:.9em; }
  pre { background:var(--code); border:1px solid var(--line); border-radius:6px; padding:.9rem 1rem; overflow-x:auto; }
  img { max-width:100%; height:auto; border:1px solid var(--line); border-radius:6px; }
  p > img:only-child { max-width:90%; }
  p:has(> img + img) { display:flex; gap:.75rem; align-items:flex-start; }
  p:has(> img + img) img { flex:0 1 auto; min-width:0; max-width:none; }
  blockquote { margin:1rem 0; padding:.1rem 1rem; border-left:4px solid var(--accent); background:var(--code); }
  table { border-collapse:collapse; margin:1rem 0; }
  th,td { border:1px solid var(--line); padding:.4rem .8rem; text-align:left; }
  details.answer { border:1px dashed var(--line); border-radius:6px; margin:1rem 0; }
  details.answer > :not(summary) { margin-left:1rem; margin-right:1rem; }
  blockquote:has(+ details.answer) { margin-bottom:0; border-radius:6px 6px 0 0; }
  blockquote + details.answer { margin-top:0; border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:0 0 6px 6px; }
  .callout { --c:#00a7b5; --bg:#e6f6f8; border:1px solid var(--line); border-left:4px solid var(--c); border-radius:6px; background:var(--bg); margin:1.2rem 0; padding:.1rem 1rem .1rem 1rem; }
  .callout-tip { --c:#1fa463; --bg:#e8f7ef; }
  .callout-warning { --c:#e0861a; --bg:#fff4e3; }
  .callout-danger { --c:#d92d20; --bg:#fdeceb; }
  .callout-success { --c:#1fa463; --bg:#e8f7ef; }
  .callout-title { font-weight:600; padding:.6rem 0 0; }
  .callout-title::before { content:"\2139\FE0F"; margin-right:.5rem; }
  .callout-tip > .callout-title::before { content:"\1F4A1"; }
  .callout-warning > .callout-title::before, .callout-danger > .callout-title::before { content:"\26A0\FE0F"; }
  .callout-success > .callout-title::before { content:"\2705"; }
  .callout-note > .callout-title::before { content:"\1F4DD"; }
  .callout-body > :first-child { margin-top:.4rem; }
  .callout-body > :last-child { margin-bottom:.8rem; }
  details.quiz-box { --ok:#1a7f37; --ok-bg:#e9f7ee; --bad:#cf222e; --bad-bg:#fdeceb; border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:6px; padding:0 1rem; margin:1.2rem 0; background:var(--bg); font-size:.9em; }
  .quiz { padding-bottom:.8rem; }
  .quiz-q { font-weight:600; }
  .quiz-opt { border:1px solid var(--line); border-radius:6px; margin:.5rem 0; }
  .quiz-opt > label { display:flex; gap:.6rem; align-items:flex-start; padding:.55rem .8rem; cursor:pointer; }
  .quiz-opt > label input { margin-top:.3rem; }
  .quiz-opt:hover { border-color:var(--accent); }
  .quiz-opt.correct { border-color:var(--ok); background:var(--ok-bg); }
  .quiz-opt.wrong { border-color:var(--bad); background:var(--bad-bg); }
  .quiz-opt.correct > label::after { content:"\2713  Correct"; margin-left:auto; color:var(--ok); font-weight:600; white-space:nowrap; }
  .quiz-opt.wrong > label::after { content:"\2717  Not quite"; margin-left:auto; color:var(--bad); font-weight:600; white-space:nowrap; }
  .quiz-fb { padding:0 .8rem .2rem 2.3rem; font-style:italic; color:var(--muted); }
  .quiz-fb[hidden] { display:none; }
  .quiz-fb p { margin:.1rem 0 .5rem; }
  details.snippet > pre { position:relative; padding-right:5rem; }
  .copy { position:absolute; top:.5rem; right:.5rem; font:inherit; font-size:.85em; padding:.2rem .6rem; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); cursor:pointer; }
  .copy:hover { border-color:var(--accent); color:var(--accent); }
  details.snippet pre { white-space:pre-wrap; word-break:break-word; }
  pre code { background:none; padding:0; font-size:.85em; }
  details.snippet { border:1px solid var(--line); border-radius:6px; margin:1rem 0; }
  details.snippet > summary, details.answer > summary, details.quiz-box > summary, details.callout > summary { display:flex; align-items:center; gap:.6rem; list-style:none; cursor:pointer; font-weight:600; font-size:.95em; color:var(--fg); }
  details > summary::-webkit-details-marker { display:none; }
  details.snippet > summary, details.answer > summary { padding:.6rem 1rem; }
  details.quiz-box > summary, details.callout > summary { padding:.6rem 0; }
  details.quiz-box[open] > summary, details.callout[open] > summary { padding-bottom:0; }
  details.snippet > summary::after, details.answer > summary::after, details.quiz-box > summary::after, details.callout > summary::after { content:"\25B6"; margin-left:auto; font-size:.7em; color:var(--muted); transition:transform .15s; }
  details[open] > summary::after { transform:rotate(90deg); }
  details > summary::before { display:inline-block; width:var(--ico); }
  blockquote > p:first-child > strong:only-child::before { content:"\2753"; display:inline-block; width:var(--ico); margin-right:.6rem; }
  blockquote > :not(:first-child) { margin-left:calc(var(--ico) + .6rem); }
  blockquote + details.answer > :not(summary) { margin-left:calc(1rem + var(--ico) + .6rem); }
  details.snippet > summary::before { content:"\1F4CB"; }
  details.answer > summary::before { content:"\1F511"; }
  details.quiz-box > summary::before { content:"\1F3AF"; }
  details.callout > summary::before { margin-right:0; }
  details.snippet > pre { margin:0; border:0; border-top:1px solid var(--line); border-radius:0 0 6px 6px; }
</style>
</head>
<body>
{{body}}
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>hljs.highlightAll();</script>
<script>
document.querySelectorAll(".quiz").forEach(function (quiz) {
  quiz.addEventListener("change", function (e) {
    var chosen = e.target.closest(".quiz-opt");
    quiz.querySelectorAll(".quiz-opt").forEach(function (opt) {
      var on = opt === chosen;
      opt.classList.toggle("correct", on && opt.dataset.correct === "1");
      opt.classList.toggle("wrong", on && opt.dataset.correct !== "1");
      opt.querySelector(".quiz-fb").hidden = !on;
    });
  });
});
</script>
<script>
document.querySelectorAll("details.snippet > pre").forEach(function (pre) {
  var btn = document.createElement("button");
  btn.type = "button"; btn.className = "copy"; btn.textContent = "Copy";
  btn.addEventListener("click", function () {
    var text = pre.querySelector("code").textContent;
    function done() { btn.textContent = "Copied!"; setTimeout(function () { btn.textContent = "Copy"; }, 1500); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "Select and copy manually"; }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
  });
  pre.appendChild(btn);
});
</script>
</body>
</html>
