<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root { color-scheme:light; --fg:#1c1c1e; --bg:#fff; --muted:#5f6368; --line:#e3e3e3; --code:#f5f5f5; --accent:#fc5d0d; }
  body { font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--fg); background:var(--bg); max-width:50rem; margin:0 auto; padding:1.5rem 1rem 3rem; }
  h1,h2,h3 { line-height:1.25; }
  h1 { font-size:1.6rem; } h2 { font-size:1.3rem; } h3 { font-size:1.1rem; }
  a { color:var(--accent); }
  code { background:var(--code); padding:.1em .35em; border-radius:4px; font-size:.9em; }
  pre { background:var(--code); border:1px solid var(--line); border-radius:6px; padding:.9rem 1rem; overflow-x:auto; }
  img { max-width:100%; height:auto; }
  p:has(> img + img) { display:flex; gap:.75rem; align-items:flex-start; }
  p:has(> img + img) img { flex:1 1 0; min-width:0; }
  blockquote { margin:1rem 0; padding:.1rem 1rem; border-left:4px solid var(--accent); background:var(--code); }
  table { border-collapse:collapse; margin:1rem 0; }
  th,td { border:1px solid var(--line); padding:.4rem .8rem; text-align:left; }
  details.answer { border:1px solid var(--line); border-radius:6px; margin:1rem 0; }
  details.answer > summary { cursor:pointer; padding:.6rem 1rem; font-weight:600; color:var(--accent); }
  details.answer > :not(summary) { margin-left:1rem; margin-right:1rem; }
  details.snippet pre { white-space:pre-wrap; word-break:break-word; }
  pre code { background:none; padding:0; font-size:.85em; }
  details.snippet { border:1px solid var(--line); border-radius:6px; margin:1rem 0; }
  details.snippet > summary { cursor:pointer; padding:.6rem 1rem; font-weight:600; color:var(--muted); list-style:none; }
  details.snippet > summary::before { content:"\25B6"; display:inline-block; margin-right:.6rem; font-size:.75em; transition:transform .15s; }
  details.snippet[open] > summary::before { transform:rotate(90deg); }
  details.snippet > summary::-webkit-details-marker { display:none; }
  details.snippet > pre { margin:0; border:0; border-top:1px solid var(--line); border-radius:0 0 6px 6px; }
</style>
</head>
<body>
{{body}}
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>hljs.highlightAll();</script>
</body>
</html>
